<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Atelier d'illustrations ZkilZ</title>
<!--
  Dessine en HTML / CSS les illustrations des pages, à 1600 px de large, aux
  couleurs du site. Elles tiennent la place en attendant les versions IA
  (prompts dans PROMPTS-MASCOTTE.md) : une image IA déposée avec le même nom
  les remplace. Export : voir tools/illustrations/README.md.
  #1 … #4 n'affiche qu'un groupe, #nom ou #nom1,nom2 une liste d'illustrations (une capture pleine page par groupe).
-->
<style>
  body { margin: 0; background: #fff; font-family: system-ui, sans-serif; }
  .ill { position: relative; width: 1600px; overflow: hidden; background: #E1EBFF; }
  .ill i, .ill b, .ill span, .ill div { position: absolute; display: block; box-sizing: border-box; }
  .soft { border-radius: 50%; }
  .dev { box-shadow: 0 40px 80px -30px rgba(11, 27, 63, .45), 0 0 0 1px rgba(11, 27, 63, .08); }
  .scr { overflow: hidden; background: #fff; }
  .scr i { border-radius: 999px; }
  .scr .sq { border-radius: 10%; }
  .card { background: #fff; box-shadow: 0 24px 50px -24px rgba(11, 27, 63, .35); }
  img { position: absolute; display: block; }
  svg { position: absolute; overflow: visible; }
</style>
</head>
<body>
<script>
// Couleurs du site
var N = '#0B1B3F', A = '#1F6BFF', Z = '#1E9BFF', L = '#8FDBFF', I = '#E1EBFF', W = '#fff', G = '#D5DDEC', G2 = '#EEF2F9', S = '#B7CCF5';
var M = '../../assets/img/mascotte/';

// élément en % de son parent
// un arrondi en % déforme les formes larges : on le passe en em (taille de l'écran)
function rad(r) {
  if (r === undefined || typeof r !== 'string' || r.slice(-1) !== '%' || r === '50%') return r;
  return parseFloat(r) >= 18 ? '99em' : '.8em';
}
function e(x, y, w, h, bg, r, extra) {
  r = rad(r);
  return '<i style="left:' + x + '%;top:' + y + '%;width:' + w + '%;height:' + h + '%;background:' + bg + ';' +
    (r !== undefined ? 'border-radius:' + r + ';' : '') + (extra || '') + '"></i>';
}
function sq(x, y, w, h, bg, r) { return e(x, y, w, h, bg, r === undefined ? '10%' : r); }
function circ(x, y, w, bg, ratio) { return '<i style="left:' + x + '%;top:' + y + '%;width:' + w + '%;aspect-ratio:1;background:' + bg + ';border-radius:50%"></i>'; }
// élément en px dans l'illustration
function px(x, y, w, h, inner, cls, extra) {
  var fs = /scr/.test(cls || '') ? 'font-size:' + (w / 32) + 'px;' : '';
  return '<div class="' + (cls || '') + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;' + fs + (extra || '') + '">' + (inner || '') + '</div>';
}
// lignes de texte dessinées en barres
function lines(x, y, w, n, color, h, gap) {
  var s = '', ws = [100, 86, 92, 64, 78, 55];
  for (var k = 0; k < n; k++) s += e(x, y + k * (h + gap), w * ws[k % ws.length] / 100, h, color);
  return s;
}
function chart(x, y, w, h, color, area) {
  return '<svg style="left:' + x + '%;top:' + y + '%;width:' + w + '%;height:' + h + '%" viewBox="0 0 200 90" preserveAspectRatio="none">' +
    (area ? '<path d="M0 90 L0 70 C 20 66 30 52 50 56 S 80 40 100 44 S 140 20 160 26 S 190 8 200 10 L200 90Z" fill="' + area + '"/>' : '') +
    '<path d="M0 70 C 20 66 30 52 50 56 S 80 40 100 44 S 140 20 160 26 S 190 8 200 10" fill="none" stroke="' + color + '" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>';
}
function barsChart(x, y, w, h, c1, c2) {
  var s = '<svg style="left:' + x + '%;top:' + y + '%;width:' + w + '%;height:' + h + '%" viewBox="0 0 200 100" preserveAspectRatio="none">';
  [40, 62, 48, 78, 58, 88, 70].forEach(function (v, k) { s += '<rect x="' + (k * 29 + 4) + '" y="' + (100 - v) + '" width="18" height="' + v + '" rx="5" fill="' + (k === 5 ? c1 : c2) + '"/>'; });
  return s + '</svg>';
}
function check(x, y, w) {
  return '<svg style="left:' + x + '%;top:' + y + '%;width:' + w + '%" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="' + A + '"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function ring(x, y, w, p) {
  var c = 2 * Math.PI * 40;
  return '<svg style="left:' + x + '%;top:' + y + '%;width:' + w + '%" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="' + I + '" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="' + A + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * p) + ' ' + c + '" transform="rotate(-90 50 50)"/></svg>';
}
function bottle(x, y, w, color) {
  return '<svg style="left:' + x + '%;top:' + y + '%;width:' + w + '%" viewBox="0 0 60 100"><rect x="22" y="2" width="16" height="14" rx="3" fill="' + N + '"/><rect x="26" y="15" width="8" height="8" fill="' + S + '"/><rect x="6" y="22" width="48" height="76" rx="14" fill="' + color + '"/><rect x="14" y="44" width="32" height="20" rx="4" fill="#fff" opacity=".85"/></svg>';
}

// --- Appareils (en px) ---------------------------------------------------------
function laptop(x, y, w, ui, tilt) {
  var h = w * .625, b = w * .022;
  return px(x, y, w, h + w * .06,
    px(0, 0, w, h, px(b, b, w - 2 * b, h - 2 * b, ui, 'scr', 'border-radius:' + (w * .008) + 'px'), 'dev', 'background:' + N + ';border-radius:' + (w * .03) + 'px ' + (w * .03) + 'px ' + (w * .008) + 'px ' + (w * .008) + 'px') +
    px(-w * .07, h, w * 1.14, w * .045, '', '', 'background:linear-gradient(#C9D6EE,#AFC0E0);border-radius:0 0 ' + (w * .04) + 'px ' + (w * .04) + 'px;box-shadow:0 30px 50px -20px rgba(11,27,63,.4)') +
    px(w * .42, h, w * .16, w * .014, '', '', 'background:#9DB0D6;border-radius:0 0 12px 12px'),
    '', tilt ? 'transform:' + tilt : '');
}
function phone(x, y, w, ui, tilt, bg) {
  var h = w * 2.08, b = w * .04;
  return px(x, y, w, h,
    px(b, b, w - 2 * b, h - 2 * b, ui + px((w - 2 * b) * .34, (h - 2 * b) * .018, (w - 2 * b) * .32, (h - 2 * b) * .028, '', '', 'background:' + N + ';border-radius:99px;z-index:3'), 'scr', 'border-radius:' + (w * .12) + 'px;background:' + (bg || W)),
    'dev', 'background:' + N + ';border-radius:' + (w * .15) + 'px;' + (tilt ? 'transform:' + tilt : ''));
}
function monitor(x, y, w, ui) {
  var h = w * .58, b = w * .016;
  return px(x, y, w, h, px(b, b, w - 2 * b, h - 2 * b, ui, 'scr', 'border-radius:' + (w * .008) + 'px'), 'dev', 'background:' + N + ';border-radius:' + (w * .018) + 'px') +
    px(x + w * .44, y + h, w * .12, w * .12, '', '', 'background:linear-gradient(#B9C9E8,#9FB3DA)') +
    px(x + w * .32, y + h + w * .12, w * .36, w * .025, '', '', 'background:#AFC0E0;border-radius:' + (w * .02) + 'px;box-shadow:0 20px 40px -14px rgba(11,27,63,.4)');
}
function win(x, y, w, h, ui, extra) {
  var bar = Math.max(26, w * .035);
  return px(x, y, w, h,
    px(0, 0, w, bar, '<i style="left:' + bar * .6 + 'px;top:' + bar * .38 + 'px;width:' + bar * .26 + 'px;height:' + bar * .26 + 'px;background:#F2B8B8;border-radius:50%"></i><i style="left:' + bar * 1.05 + 'px;top:' + bar * .38 + 'px;width:' + bar * .26 + 'px;height:' + bar * .26 + 'px;background:#F2DBA8;border-radius:50%"></i><i style="left:' + bar * 1.5 + 'px;top:' + bar * .38 + 'px;width:' + bar * .26 + 'px;height:' + bar * .26 + 'px;background:#B8E2C2;border-radius:50%"></i>' + e(35, 25, 30, 50, G2, '99px'), '', 'background:#F6F8FC') +
    px(0, bar, w, h - bar, ui, 'scr'),
    'dev', 'background:#fff;border-radius:' + Math.max(14, w * .016) + 'px;overflow:hidden;' + (extra || ''));
}

// --- Écrans (en %) --------------------------------------------------------------
var UI = {
  site: function () {
    return e(5, 6, 4, 6, A, '50%') + e(60, 7.5, 6, 3, G) + e(69, 7.5, 6, 3, G) + e(78, 7.5, 6, 3, G) + e(87, 5.5, 9, 7, A) +
      e(5, 22, 46, 8, N) + e(5, 33, 38, 8, N) + lines(5, 47, 40, 2, G, 3, 3) + e(5, 61, 18, 8, A) +
      e(58, 18, 37, 52, I, '24px') + circ(64, 24, 22, L) + sq(78, 44, 14, 18, A, '20%') +
      sq(5, 78, 28, 18, G2, '10%') + sq(36, 78, 28, 18, G2, '10%') + sq(67, 78, 28, 18, G2, '10%') + e(8, 84, 14, 3, S) + e(39, 84, 14, 3, S) + e(70, 84, 14, 3, S);
  },
  wire: function () {
    return e(5, 6, 4, 6, G, '50%') + e(60, 7.5, 6, 3, G) + e(69, 7.5, 6, 3, G) + e(78, 7.5, 6, 3, G) + e(87, 5.5, 9, 7, G) +
      e(5, 22, 46, 8, G) + e(5, 33, 38, 8, G) + lines(5, 47, 40, 2, G2, 3, 3) + e(5, 61, 18, 8, G) +
      e(58, 18, 37, 52, G2, '12px', 'border:3px dashed ' + G) + sq(5, 78, 28, 18, G2) + sq(36, 78, 28, 18, G2) + sq(67, 78, 28, 18, G2);
  },
  shop: function () {
    return e(4, 5, 4, 6, N, '50%') + e(70, 6, 6, 3, G) + e(80, 6, 6, 3, G) + e(90, 4.5, 6, 6, A, '50%') +
      e(4, 18, 50, 76, I, '18px') + bottle(19, 26, 20, A) + e(60, 20, 30, 6, N) + e(60, 30, 20, 4, G) + e(60, 40, 14, 7, A) +
      lines(60, 54, 34, 3, G, 2.5, 3) + e(60, 72, 9, 6, W, '99px', 'border:3px solid ' + A) + e(71, 72, 9, 6, G2) + e(82, 72, 9, 6, G2) + e(60, 84, 34, 9, A);
  },
  dash: function () {
    var s = e(0, 0, 16, 100, N, '0') + e(3, 6, 10, 4, A) ;
    for (var k = 0; k < 5; k++) s += e(3, 18 + k * 9, 10, 3.5, k === 0 ? Z : '#2A3A63');
    s += e(20, 6, 30, 5, G2) + circ(92, 5, 4, L);
    for (k = 0; k < 4; k++) s += sq(20 + k * 19.5, 16, 17.5, 16, G2, '10%') + e(22 + k * 19.5, 19, 8, 2.5, G) + e(22 + k * 19.5, 24, 11, 4, k === 0 ? A : N);
    s += sq(20, 37, 49, 34, G2, '8%') + chart(23, 45, 43, 22, A, 'rgba(31,107,255,.16)') + e(23, 40, 14, 3, N);
    s += sq(71, 37, 26, 34, G2, '8%') + barsChart(73.5, 46, 21, 21, A, S);
    for (k = 0; k < 3; k++) s += e(20, 76 + k * 7.5, 77, 5.5, k % 2 ? W : G2, '8px') + e(22, 77.3 + k * 7.5, 18, 2.6, G) + e(86, 77 + k * 7.5, 8, 3.4, k === 1 ? L : I);
    return s;
  },
  appHome: function () {
    return e(8, 7, 30, 3, G) + e(8, 11.5, 55, 4, N) + circ(80, 7, 12, L) +
      sq(8, 21, 84, 30, A, '12%') + ring(14, 25, 30, .68) + e(52, 29, 32, 3, '#BFD3FF') + e(52, 35, 24, 5, W) + e(52, 44, 30, 2.5, '#BFD3FF') +
      sq(8, 55, 40, 20, G2, '14%') + sq(52, 55, 40, 20, G2, '14%') + circ(13, 59, 10, L) + circ(57, 59, 10, I) + e(13, 67, 26, 2.5, G) + e(57, 67, 26, 2.5, G) +
      sq(8, 79, 84, 8, G2, '20%') + e(0, 91, 100, 9, W, '0', 'border-top:2px solid ' + G2) + circ(18, 93, 6, A) + circ(40, 93, 6, G) + circ(62, 93, 6, G) + circ(84, 93, 6, G);
  },
  booking: function () {
    var s = e(8, 7, 50, 4, N) + e(8, 13, 34, 2.5, G);
    for (var k = 0; k < 5; k++) s += sq(8 + k * 17.5, 20, 14, 10, k === 2 ? A : G2, '20%') + e(11 + k * 17.5, 23, 8, 2, k === 2 ? W : G) + e(11 + k * 17.5, 26.5, 8, 2, k === 2 ? '#BFD3FF' : G);
    s += e(8, 36, 40, 3, N);
    for (k = 0; k < 3; k++) s += sq(8, 43 + k * 10, 84, 8, k === 1 ? I : G2, '30%') + e(13, 46 + k * 10, 20, 2.5, k === 1 ? A : G) + e(70, 45.5 + k * 10, 16, 3.5, k === 1 ? A : W, '99px');
    return s + sq(8, 78, 84, 10, A, '30%') + e(34, 82, 32, 2.5, W);
  },
  confirm: function () {
    return check(32, 14, 36) + e(20, 46, 60, 4, N) + e(28, 53, 44, 2.5, G) +
      sq(8, 62, 84, 22, G2, '14%') + lines(14, 66, 50, 3, G, 2.5, 3) + e(70, 66, 16, 3, A) + sq(8, 88, 84, 8, N, '30%');
  },
  reel: function () {
    return e(0, 0, 100, 100, A, '0') + circ(-20, 10, 90, Z) + circ(30, 48, 70, '#4D8BFF') + e(-10, 60, 130, 14, L, '0', 'transform:rotate(-24deg)') +
      sq(28, 30, 44, 26, W, '10%') + bottle(42, 33, 16, N) +
      circ(84, 52, 9, 'rgba(255,255,255,.25)') + circ(84, 62, 9, 'rgba(255,255,255,.25)') + circ(84, 72, 9, 'rgba(255,255,255,.25)') +
      '<svg style="left:86.5%;top:54.2%;width:4%" viewBox="0 0 24 22"><path d="M12 21 C 5 15 1 11.5 1 7 C 1 3.6 3.6 1 7 1 C 9 1 10.9 2 12 3.6 C 13.1 2 15 1 17 1 C 20.4 1 23 3.6 23 7 C 23 11.5 19 15 12 21Z" fill="#fff"/></svg>' +
      e(8, 82, 40, 2.5, W) + e(8, 86.5, 60, 2, 'rgba(255,255,255,.7)') + e(0, 96, 100, 1.2, 'rgba(255,255,255,.3)', '0') + e(0, 96, 46, 1.2, W, '0');
  },
  profile: function () {
    var s = circ(8, 6, 20, A) + e(34, 8, 14, 3, N) + e(54, 8, 14, 3, N) + e(74, 8, 14, 3, N) + e(34, 13, 14, 2, G) + e(54, 13, 14, 2, G) + e(74, 13, 14, 2, G) +
      e(8, 21, 50, 3, N) + e(8, 26, 70, 2, G) + sq(8, 31, 84, 5, A, '30%');
    var tiles = [[A, 'c'], [I, 'b'], [N, 'q'], [L, 'd'], [A, 'b'], [I, 'c'], [N, 'd'], [Z, 'q'], [I, 'b']];
    tiles.forEach(function (t, k) {
      var x = 2 + (k % 3) * 32.3, y = 40 + Math.floor(k / 3) * 19.5;
      s += sq(x, y, 31.6, 19, t[0], '2%');
      if (t[1] === 'c') s += circ(x + 9, y + 3, 14, t[0] === A ? L : A);
      if (t[1] === 'b') s += bottle(x + 11, y + 2.5, 9, t[0] === I ? A : N);
      if (t[1] === 'q') s += e(x + 6, y + 6, 20, 2.5, W) + e(x + 6, y + 10, 14, 2.5, W);
      if (t[1] === 'd') s += e(x - 4, y + 7, 40, 4, W, '0', 'transform:rotate(-30deg);opacity:.7');
    });
    return s;
  },
  mobileSite: function () {
    return UI.site() + e(0, 0, 100, 100, 'rgba(11,27,63,.35)', '0') +
      e(0, 52, 100, 48, W, '28px 28px 0 0') + e(42, 54.5, 16, 1.2, G) +
      [0, 1, 2, 3].map(function (k) { return e(10, 60 + k * 7, 50, 2.6, k === 0 ? A : N) + e(82, 60 + k * 7, 6, 2.6, G); }).join('') +
      sq(8, 89, 84, 7, A, '30%');
  },
  admin: function () {
    var s = e(0, 0, 20, 100, G2, '0') + e(3, 6, 12, 3.5, N);
    for (var k = 0; k < 6; k++) s += e(3, 16 + k * 8, 14, 3.5, k === 1 ? A : G, '8px');
    s += e(25, 6, 30, 5, N) + e(80, 5, 15, 7, A, '10px');
    s += e(25, 18, 14, 2.5, G) + sq(25, 22, 45, 7, W, '12%') + e(27, 24.5, 22, 2.4, N) + e(49.5, 23.8, .5, 3.8, A, '0');
    s += e(25, 34, 14, 2.5, G) + sq(25, 38, 45, 28, I, '6%') + bottle(42, 40, 9, A) + e(25, 69, 14, 2.5, G) + sq(25, 73, 20, 7, W, '12%') + e(27, 75.5, 9, 2.4, N);
    s += sq(75, 18, 21, 46, G2, '10%') + e(78, 23, 12, 2.5, N) + e(78, 30, 15, 2.5, G) + e(78, 52, 10, 2.5, N) + e(86, 51, 8, 4.5, A, '99px') + circ(90.5, 51.6, 3, W);
    return s;
  },
  onbAccount: function () { return e(30, 14, 40, 6, N) + e(36, 24, 28, 3, G) + sq(25, 34, 50, 10, G2, '18%') + sq(25, 48, 50, 10, G2, '18%') + sq(25, 64, 50, 10, A, '18%') + e(40, 68, 20, 2.5, W); },
  onbPlans: function () {
    var s = e(30, 10, 40, 6, N);
    for (var k = 0; k < 3; k++) s += sq(8 + k * 29, 24, 26, 64, k === 1 ? A : G2, '8%') + e(12 + k * 29, 30, 12, 3, k === 1 ? '#BFD3FF' : G) + e(12 + k * 29, 37, 16, 6, k === 1 ? W : N) + lines(12 + k * 29, 50, 18, 3, k === 1 ? '#5C8FFF' : G, 2.5, 3) + e(12 + k * 29, 76, 18, 6, k === 1 ? W : W);
    return s;
  },
  onbInvite: function () {
    var s = e(30, 12, 40, 6, N);
    for (var k = 0; k < 4; k++) s += circ(20 + k * 16, 30, 11, [A, L, Z, I][k]);
    return s + sq(20, 58, 60, 10, G2, '18%') + e(24, 61.8, 26, 2.5, G) + sq(30, 74, 40, 10, A, '18%') + e(40, 78, 20, 2.5, W);
  },
  roles: function () {
    var s = e(5, 7, 26, 5, N) + e(76, 6, 19, 7, A, '12px') + e(5, 19, 90, .4, G2, '0');
    var cols = [A, L, Z, I, '#4D8BFF'], roles = [[A, W], [I, A], [G2, N], [I, A], [G2, N]];
    for (var k = 0; k < 5; k++) {
      var y = 24 + k * 14;
      s += circ(5, y, 6.5, cols[k]) + e(14, y + 2, 22, 3, N) + e(14, y + 6.5, 30, 2.4, G) + e(70, y + 1.5, 17, 7, roles[k][0], '99px') + e(73, y + 4.2, 9, 2, roles[k][1]) + e(5, y + 12, 90, .3, G2, '0');
    }
    return s;
  },
  mobileDash: function () {
    var s = e(8, 7, 40, 4, N) + circ(82, 6, 10, L);
    for (var k = 0; k < 2; k++) s += sq(8 + k * 43, 17, 41, 15, G2, '14%') + e(13 + k * 43, 20, 16, 2.4, G) + e(13 + k * 43, 25, 24, 4, k ? N : A);
    s += sq(8, 35, 84, 28, G2, '10%') + e(13, 39, 30, 2.6, N) + chart(13, 45, 74, 14, A, 'rgba(31,107,255,.16)');
    for (k = 0; k < 2; k++) s += sq(8, 67 + k * 10, 84, 8, G2, '20%') + e(13, 70 + k * 10, 34, 2.4, G) + e(74, 69.5 + k * 10, 12, 3.4, I);
    return s + e(0, 91, 100, 9, W, '0', 'border-top:2px solid ' + G2) + circ(18, 93, 6, A) + circ(40, 93, 6, G) + circ(62, 93, 6, G) + circ(84, 93, 6, G);
  },
  lock: function () {
    var s = e(0, 0, 100, 100, A, '0') + circ(-30, -10, 110, Z) + circ(20, 55, 100, '#4D8BFF') + e(30, 12, 40, 9, W) + e(38, 23, 24, 2.4, 'rgba(255,255,255,.8)');
    for (var k = 0; k < 3; k++) s += sq(7, 40 + k * 13.5, 86, 11.5, 'rgba(255,255,255,.92)', '18%') + circ(11, 42.5 + k * 13.5, 9, A) + e(25, 43 + k * 13.5, 34, 2.4, N) + e(25, 47.5 + k * 13.5, 50, 2.2, G) + e(80, 43 + k * 13.5, 9, 2, G);
    return s + e(36, 95, 28, 1, W);
  },
  homeGrid: function () {
    var s = e(0, 0, 100, 100, '#DCE6F7', '0');
    for (var k = 0; k < 16; k++) {
      var x = 9 + (k % 4) * 22, y = 10 + Math.floor(k / 4) * 20;
      if (k === 6) s += sq(x - 1, y - 1, 18, 0, A, '1.6em').replace('height:0%', 'aspect-ratio:1;height:auto') ;
      else s += sq(x, y, 16, 0, k % 3 ? '#C2CEE3' : '#B1BFD8', '1.4em').replace('height:0%', 'aspect-ratio:1;height:auto');
